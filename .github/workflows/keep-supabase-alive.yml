name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase DB to reset the inactivity timer
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/albums?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          cat /tmp/body.txt
          if [ "$code" != "200" ]; then
            echo "Supabase query failed (HTTP $code) — project may be paused or secrets are wrong."
            exit 1
          fi
          echo "Supabase query succeeded — database activity registered."
